# Builds the client on every push and pull request (Gradle, pinned dependencies, no game install needed).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            build/nether-agent.jar
            build/nether-agent-boot.jar
            build/client.json
            build/schema.json
